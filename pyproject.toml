[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "soul-serving"
version = "0.1.0"
description = "A lightweight controller and distributed, layer-sharded LLM inference nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117", "uvicorn[standard]>=0.35,<0.36",
  "httpx>=0.28,<0.29", "huggingface-hub>=0.34,<0.35",
  "msgpack>=1.1,<2", "pydantic>=2.11,<3", "websockets>=13.1,<14",
  "psutil>=7,<8",
  "anyio>=4.10,<5",
]

[project.optional-dependencies]
node = ["torch>=2.8,<2.9", "transformers==4.56.0", "safetensors>=0.6,<0.7", "numpy>=1.26,<3", "sentencepiece>=0.2,<0.3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "openai>=1.100,<3", "anthropic>=0.64,<1"]

[project.scripts]
soul = "soul.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soul"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
