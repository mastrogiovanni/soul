apiVersion: apps/v1
kind: Deployment
metadata:
  name: soul-controller
  labels:
    app: soul-controller
spec:
  # SQLite, in-memory node connections and the request queue have one owner.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soul-controller
  template:
    metadata:
      labels:
        app: soul-controller
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soul
          image: soul-controller:kind
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CONTEXT_ROOT
              value: /soul
            - name: HF_HOME
              value: /data/huggingface
          envFrom:
            - secretRef:
                name: soul-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /soul/healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soul-data
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: soul-service
  labels:
    app: soul-controller
spec:
  type: ClusterIP
  selector:
    app: soul-controller
  ports:
    - name: http
      port: 80
      targetPort: http
