apiVersion: v1
kind: PersistentVolume
metadata:
  name: soul-data
  labels:
    app: soul-controller
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: soul-data
  volumeMode: Filesystem
  hostPath:
    path: /data-plane/soul
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soul-data
  labels:
    app: soul-controller
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: soul-data
  volumeName: soul-data
  resources:
    requests:
      storage: 1Gi
