name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.0'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra node --group dev
      - run: uv run --no-sync ruff check src tests examples
      - run: uv run --no-sync ruff format --check src tests examples
      - run: uv run --no-sync pytest -q
